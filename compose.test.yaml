services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: moderator
      POSTGRES_PASSWORD: test-only
      POSTGRES_DB: listings_test
    volumes:
      - test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moderator -d listings_test"]
      interval: 2s
      timeout: 3s
      retries: 45
      start_period: 3s
    stop_grace_period: 10s
    labels:
      com.listing-moderation.workspace: "${LM_WORKSPACE:?workspace owner is required}"
      com.listing-moderation.mode: "test"
      com.listing-moderation.invocation: "${LM_INVOCATION:?invocation is required}"

  runner:
    build:
      context: .
      target: test
    environment:
      DATABASE_URL: postgres://moderator:test-only@db:5432/listings_test
      POLL_INTERVAL_MS: "1000"
      LISTING_TTL_DAYS: "30"
      TEST_FORCE_FAILURE: "${TEST_FORCE_FAILURE:-0}"
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 10s
    labels:
      com.listing-moderation.workspace: "${LM_WORKSPACE:?workspace owner is required}"
      com.listing-moderation.mode: "test"
      com.listing-moderation.invocation: "${LM_INVOCATION:?invocation is required}"

volumes:
  test-data:
    name: "${COMPOSE_PROJECT_NAME:?project is required}-test-data"
    labels:
      com.listing-moderation.workspace: "${LM_WORKSPACE:?workspace owner is required}"
      com.listing-moderation.mode: "test"
      com.listing-moderation.invocation: "${LM_INVOCATION:?invocation is required}"

networks:
  default:
    labels:
      com.listing-moderation.workspace: "${LM_WORKSPACE:?workspace owner is required}"
      com.listing-moderation.mode: "test"
      com.listing-moderation.invocation: "${LM_INVOCATION:?invocation is required}"
